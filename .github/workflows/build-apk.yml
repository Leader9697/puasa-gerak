name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: |
          flutter analyze
          flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk PuasaGerak-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PuasaGerak-apk
          path: PuasaGerak-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Puasa & Gerak 1.0.${{ github.run_number }}
          body: |
            Unduh file **PuasaGerak-1.0.${{ github.run_number }}.apk** di bawah, lalu buka di HP Android untuk memasang.
            Versi baru bisa dipasang langsung di atas versi lama, data tetap aman.
          files: PuasaGerak-*.apk
          make_latest: true
