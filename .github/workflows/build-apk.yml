name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
  VER: 1.0.${{ github.run_number }}

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check code
        run: |
          flutter analyze
          flutter test

      # How this push ships:
      #   plain   = no Shorebird key yet: normal APK only
      #   release = new APK (needed for native code, plugins, first Shorebird build)
      #   patch   = Dart-only change: sent over the air, no reinstall
      # Add [release] or [patch] to the commit message to force one.
      - name: Decide release or patch
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
        run: |
          changed="$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo FORCE_RELEASE)"
          if [ -z "$SHOREBIRD_TOKEN" ]; then mode=plain
          elif [ ! -f shorebird.yaml ]; then mode=release
          elif [[ "$MSG" == *"[release]"* ]]; then mode=release
          elif [[ "$MSG" == *"[patch]"* ]]; then mode=patch
          elif echo "$changed" | grep -qE '^(android/|pubspec\.(yaml|lock)$|FORCE_RELEASE)'; then mode=release
          else mode=patch
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Build APK
        if: steps.mode.outputs.mode == 'plain'
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=$VER
          cp build/app/outputs/flutter-apk/app-release.apk PuasaGerak-$VER.apk

      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.mode.outputs.mode != 'plain'
        with:
          cache: true

      - name: Connect app to Shorebird (first time only)
        if: steps.mode.outputs.mode != 'plain' && hashFiles('shorebird.yaml') == ''
        run: |
          flutter build apk --config-only
          shorebird init --display-name "Puasa & Gerak" < /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shorebird.yaml pubspec.yaml
          git commit -m "Add Shorebird app id [skip ci]"
          git push

      - name: Shorebird release (new APK)
        if: steps.mode.outputs.mode == 'release'
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: 3.50.1
          args: --artifact apk -- --build-number=${{ github.run_number }} --build-name=${{ env.VER }}

      - name: Collect APK
        if: steps.mode.outputs.mode == 'release'
        run: cp build/app/outputs/flutter-apk/app-release.apk PuasaGerak-$VER.apk

      - name: Shorebird patch (update without reinstall)
        if: steps.mode.outputs.mode == 'patch'
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: latest

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.mode != 'patch'
        with:
          name: PuasaGerak-apk
          path: PuasaGerak-*.apk

      - name: Publish release
        if: steps.mode.outputs.mode != 'patch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Puasa & Gerak ${{ env.VER }}
          body: |
            Unduh file **PuasaGerak-${{ env.VER }}.apk** di bawah, lalu buka di HP Android untuk memasang.
            Versi baru bisa dipasang langsung di atas versi lama, data tetap aman.
          files: PuasaGerak-*.apk
          make_latest: true
