name: Crash probe

# Installs the release APK on an emulator, opens the app and prints any crash
# from logcat. Runs on pull requests; publishes nothing.
on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.faris.puasa_gerak/.MainActivity || true
            sleep 25
            adb shell am broadcast -a android.intent.action.MY_PACKAGE_REPLACED -n com.faris.puasa_gerak/.FastReceiver || true
            sleep 5
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d | grep -E "AndroidRuntime|FATAL|puasa_gerak|flutter" | tail -200 > app.txt || true
            adb logcat -d | grep -B2 -A30 "Failed to handle method call" | head -120 > plugin.txt || true
            echo "===== PLUGIN ERRORS ====="; cat plugin.txt
            echo "===== CRASH BUFFER ====="; cat crash.txt
            echo "===== APP LOG ====="; cat app.txt
            adb shell pidof com.faris.puasa_gerak && echo "APP ALIVE" || echo "APP DEAD"
            if grep -q "FATAL EXCEPTION" crash.txt; then echo "App crashed"; exit 1; fi
            if grep -q "Failed to handle method call" plugin.txt; then echo "A plugin failed"; exit 1; fi
